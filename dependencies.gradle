def angelicaDevJar = providers.gradleProperty('angelicaDevJar').orNull
def angelicaVersion = providers.gradleProperty('angelicaVersion').getOrElse('2.2.25')

dependencies {
    if (angelicaDevJar != null) {
        compileOnly files(angelicaDevJar)
    } else {
        compileOnly("com.github.GTNewHorizons:Angelica:${angelicaVersion}:dev") {
            transitive = false
        }
    }

    compileOnly 'org.projectlombok:lombok:1.18.24'
    annotationProcessor 'org.projectlombok:lombok:1.18.24'

    implementation 'com.github.GTNewHorizons:GTNHLib:0.11.37:dev'
    runtimeOnlyNonPublishable("com.github.GTNewHorizons:NotEnoughItems:2.8.123-GTNH:dev")
}
